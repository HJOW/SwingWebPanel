<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100" viewBox="0 0 100 100">
<style>g > rect:nth-child(2n+1) { fill: #c00 } g > rect:nth-child(even) { fill: #00c } g > rect:last-child { stroke: #000; stroke-width: 2 } rect ~ circle { fill: #0a0 } rect[class^="a"] { opacity: .5 } rect[class$="z"] { stroke: #fa0; stroke-width: 3 } rect[class*="m"] { stroke-dasharray: 3 } :is(circle, ellipse) { stroke: #000 } :not(rect):not(g):not(style) { stroke-width: 3 } rect:only-of-type { fill: #909 }</style><g><rect x="5" y="5" width="15" height="40"/><rect x="25" y="5" width="15" height="40"/><rect x="45" y="5" width="15" height="40"/><rect class="a1 m" x="65" y="5" width="15" height="40"/><rect class="xyz" x="85" y="5" width="10" height="40"/></g><g><circle cx="20" cy="75" r="15" fill="#ccc"/><rect x="45" y="65" width="20" height="20"/><circle cx="80" cy="75" r="15"/></g>
</svg>
