<style>g > rect { fill: #c00 } g rect.x { fill: #00c } rect + circle { fill: #0a0 } rect:first-child { stroke: #000; stroke-width: 3 } [data-k="v"] { fill: #fa0 } circle:not(.n) { opacity: .5 } * { stroke-linejoin: round }</style><g><rect x="5" y="5" width="30" height="30"/><circle cx="55" cy="20" r="15"/><circle class="n" cx="85" cy="20" r="10"/><rect class="x" x="5" y="50" width="30" height="30"/><rect data-k="v" x="45" y="50" width="30" height="30"/></g>
</svg>
