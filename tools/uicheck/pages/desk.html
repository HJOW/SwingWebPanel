<head>

<style>

<body>
<h1>데스크톱 앱 확인 페이지</h1>
<p class="screen-only">이 문단은 화면에서만 보입니다 (screen only).</p>
<p class="print-only">이 문단은 인쇄할 때만 보입니다 (print only).</p>
<p>The quick brown fox jumps over the lazy dog. 찾기 시험을 위한 문장입니다: swing, Swing, SWING 이 세 번 나옵니다.</p>
<div class="box">상자 안의 글. <a id="next" href="desk2.html">다음 페이지로 가는 링크</a> 와
<a id="blank" href="desk2.html" target="_blank">새 창 링크</a>.</div>
<p><button id="popup" onclick="window.open('desk2.html', 'pop', 'width=360,height=240')">팝업 열기</button>
<button id="log" onclick="console.log('버튼을 눌렀습니다'); console.warn('경고 한 줄'); console.error('오류 한 줄')">콘솔에 쓰기</button></p>
<script>
console.log('desk.html 을 읽었습니다');
var lines = '';
for (var i = 1; i <= 60; i++) {
  lines += '<p>본문 ' + i + '번째 줄입니다. swing 은 여기에도 있습니다.</p>';
}
document.write(lines);
</script>
<h2 class="chapter">둘째 장 (새 쪽에서 시작)</h2>
